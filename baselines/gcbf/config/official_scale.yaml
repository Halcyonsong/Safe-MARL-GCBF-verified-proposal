# Official-scale GCBF (non-plus) — closest to MIT-REALM README + paper Table V-A.
# Eval protocol stays project-standard (same as GCBF+/DeepSet/MF):
#   DoubleIntegrator · 8 agents · area 4 · obs 4 · rays 32 · epi 32 · eval_seed 1234
#
# Diff vs memory-limited run (seed0_20261006100552):
#   n_env_train 2→16, n_env_test 4→32, batch 32→256, buffer 256→512,
#   inner_epoch 4→8, lr 3e-5→1e-5 (paper/README).
# loss_h_dot_coef=0.01 matches train.py CLI default (README does not override).

env: DoubleIntegrator
algo: gcbf
area_size: 4.0
num_agents: 8
obs: 4
n_rays: 32
seed: 0

steps: 1000
n_env_train: 16
n_env_test: 32
buffer_size: 512
batch_size: 256
inner_epoch: 8
horizon: 32
gnn_layers: 1
alpha: 1.0

lr_actor: 1.0e-5
lr_cbf: 1.0e-5
loss_action_coef: 1.0e-4
loss_unsafe_coef: 1.0
loss_safe_coef: 1.0
loss_h_dot_coef: 0.01

eval_interval: 1
eval_epi: 1
save_interval: 10
log_dir: ./logs
