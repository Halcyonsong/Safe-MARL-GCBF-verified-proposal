# Stage1 re-distill from frozen GCBF+ teacher (Phase-2 base hunt).
# Prefer launcher: bash scripts/run_stage1_redistill.sh
# Does not overwrite method/deepset/output/stage1/frozen/deepset_actor512_stage1_baseline.pkl

env: DoubleIntegrator
area_size: 4.0
num_agents: 8
obs: 4
n_rays: 32

teacher_run: baselines/gcbfplus/log/gcbf+/seed0_20261001232611
teacher_step: 1000

architecture: deepset
hidden: 512
steps: 12000                 # longer than pilot 8000
batch_size: 16
minibatch_size: 4096
buffer_capacity: 131072
rollout_length: 256
refresh_every: 5
lr: 1.0e-4

danger_radius: 0.3
danger_coef: 4.0

eval_every: 250              # denser than pilot 500
eval_episodes: 8
eval_seed: 1234              # fixed across steps/seeds
save_every: 500
log_train_every: 50          # dense loss curve

# multi-seed via run_stage1_redistill.sh seeds=0,1,2
# outputs: method/deepset/output/stage1/redistill/<run_id>/seed*/
